name: 윈도우 앱 배포

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 버전 태그 (예: v0.1.0). 비우면 빌드만 하고 릴리스는 만들지 않음'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치 (Electron, ffmpeg 포함)
        run: npm ci

      - name: yt-dlp 받기 (공식 체크섬 확인)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile vendor/yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile sums.txt
          $line = Select-String -Path sums.txt -Pattern '\syt-dlp\.exe$' | Select-Object -First 1
          $want = ($line.Line -split '\s+')[0].ToLower()
          $have = (Get-FileHash vendor/yt-dlp.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $have) { throw "yt-dlp 체크섬 불일치: $want / $have" }
          ./vendor/yt-dlp.exe --version

      - name: streamlink 받기 (치지직 다시보기·클립용, 최신 포터블 빌드)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view --repo streamlink/windows-builds --json assets,tagName | ConvertFrom-Json
          $zip = $assets.assets | Where-Object { $_.name -match '-x86_64\.zip$' } | Select-Object -First 1
          if (-not $zip) { throw "streamlink 포터블 빌드를 찾지 못했어요" }
          Write-Host "streamlink $($assets.tagName): $($zip.name)"
          gh release download $assets.tagName --repo streamlink/windows-builds --pattern $zip.name --dir sl
          Expand-Archive "sl/$($zip.name)" -DestinationPath sl/x
          $root = Get-ChildItem sl/x -Directory | Select-Object -First 1
          # 앱에 이미 ffmpeg가 있으므로 streamlink에 딸린 ffmpeg는 빼서 용량을 줄임
          Remove-Item -Recurse -Force "$($root.FullName)/ffmpeg" -ErrorAction SilentlyContinue
          Move-Item $root.FullName vendor/streamlink
          ./vendor/streamlink/bin/streamlink.exe --version
          ./vendor/streamlink/bin/streamlink.exe --can-handle-url "https://chzzk.naver.com/clips/test"
          if ($LASTEXITCODE -ne 0) { throw "streamlink가 치지직 링크를 인식하지 못해요" }

      - name: 앱 빌드 (설치 파일)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 빌드 결과 확인
        shell: pwsh
        run: |
          $app = "dist/win-unpacked"
          foreach ($f in @("$app/editin.exe", "$app/resources/bin/yt-dlp.exe", "$app/resources/streamlink/bin/streamlink.exe", "$app/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe")) {
            if (!(Test-Path $f)) { throw "빠진 파일: $f" }
            Write-Host "OK $f ($((Get-Item $f).Length) bytes)"
          }
          & "$app/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          # yt-dlp가 앱의 Node(Electron)를 JS 런타임으로 인식하는지
          $env:ELECTRON_RUN_AS_NODE = "1"
          & "$app/editin.exe" --version
          & "$app/resources/bin/yt-dlp.exe" -v --js-runtimes "node:$((Resolve-Path "$app/editin.exe").Path)" --version 2>&1 | Select-String "JS runtimes|yt-dlp version"
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          & "$app/resources/streamlink/bin/streamlink.exe" --version
          Get-ChildItem dist -Filter *.exe | Select-Object Name, Length

      - name: 실행 확인 (20초간 켜 두기)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/editin.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "앱이 바로 종료됐어요 (exit $($p.ExitCode))" }
          Write-Host "앱이 정상적으로 실행 중이에요"
          Stop-Process -Id $p.Id -Force

      - name: 빌드 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: editin-windows
          path: dist/*.exe

      - name: GitHub 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # 수동 실행이면 이 커밋에 태그를 새로 만들어서 릴리스
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: editin ${{ inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.exe
